<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Iury Amorim</title>
  <meta name="description" content="Iury Amorim, engenheiro de software em Ribeirão Preto. Logística, pagamentos e automações.">
  <meta property="og:title" content="Iury Amorim">
  <meta property="og:description" content="Engenheiro de software.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<nav class="prefs">
  <button id="lang" type="button" aria-label="EN, switch to English">EN</button>
  <button id="theme" type="button" aria-label="Alternar tema">
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</nav>

<main>
  <h1>Iury Amorim</h1>
  <p class="sub" data-i18n="sub">Engenheiro de Software · Ribeirão Preto, SP</p>
  <p class="areas" data-i18n="areas">Logística · Pagamentos · Automações</p>
  <p class="links">
    <a href="mailto:iuryasilva@gmail.com">iuryasilva@gmail.com</a>
    <a href="https://github.com/iasply">GitHub</a>
    <a href="https://www.linkedin.com/in/iury-amorim-81835328a">LinkedIn</a>
  </p>
</main>

<script>
(function () {
  var texts = {
    pt: { lang: "pt-BR", other: "EN", langLabel: "EN, switch to English", themeLabel: "Alternar tema" },
    en: {
      sub: "Software Engineer · Ribeirão Preto, Brazil",
      areas: "Logistics · Payments · Automation",
      lang: "en", other: "PT", langLabel: "PT, mudar para português", themeLabel: "Toggle theme"
    }
  };

  var root = document.documentElement;
  var langBtn = document.getElementById("lang");
  var themeBtn = document.getElementById("theme");
  var i18n = document.querySelectorAll("[data-i18n]");

  i18n.forEach(function (el) { texts.pt[el.dataset.i18n] = el.textContent; });

  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  var current = load("lang");
  if (current !== "pt" && current !== "en") current = (navigator.language || "pt").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";

  function setLang(code) {
    var t = texts[code];
    current = code;
    root.lang = t.lang;
    i18n.forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
    langBtn.textContent = t.other;
    langBtn.setAttribute("aria-label", t.langLabel);
    themeBtn.setAttribute("aria-label", t.themeLabel);
  }

  langBtn.addEventListener("click", function () {
    setLang(current === "pt" ? "en" : "pt");
    save("lang", current);
  });

  themeBtn.addEventListener("click", function () {
    var dark = root.dataset.theme
      ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    save("theme", root.dataset.theme);
  });

  setLang(current);
})();
</script>
</body>
</html>
